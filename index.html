<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jungle Dash</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">Jungle Dash</div>
        <button id="menuButton" class="micro-btn hidden">Main Menu</button>
      </header>

      <main class="game-stage">
        <canvas id="gameCanvas" width="960" height="540"></canvas>

        <div id="hud" class="hud hidden">
          <div class="hud-item"><span class="label">Score</span><span id="scoreValue">0</span></div>
          <div class="hud-item"><span class="label">Coins</span><span id="coinValue">0</span></div>
          <div class="hud-item"><span class="label">Health</span><span id="healthValue">3</span></div>
          <div class="hud-item"><span class="label">Time</span><span id="timeValue">0.0s</span></div>
        </div>

        <div id="menu" class="overlay visible">
          <div class="panel">
            <p class="eyebrow">Browser Platform Adventure</p>
            <h1>Jungle Dash</h1>
            <p class="tagline">Dash through the jungle, collect treasure, dodge enemies, and reach the finish flag.</p>

            <div class="button-row">
              <button class="primary" data-action="start-adventure">Play Adventure</button>
              <button data-action="start-time">Time Attack</button>
            </div>

            <div class="button-row compact">
              <button data-action="shop">Character Shop</button>
              <button data-action="reset-progress">Reset Progress</button>
            </div>
          </div>
        </div>

        <div id="shop" class="overlay hidden">
          <div class="panel panel-wide">
            <div class="panel-header">
              <h2>Character Shop</h2>
              <button class="micro-btn" data-action="back-menu">Back</button>
            </div>
            <div class="shop-topline">
              <span>Banked coins: <strong id="bankCoins">0</strong></span>
            </div>
            <div id="shopList" class="shop-list"></div>
          </div>
        </div>

        <div id="message" class="overlay hidden">
          <div class="panel">
            <h2 id="messageTitle">You Win!</h2>
            <p id="messageText">You reached the finish flag.</p>
            <div class="button-row">
              <button id="messagePrimary" class="primary">Play Again</button>
              <button id="messageSecondary">Main Menu</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="game.js"></script>
  </body>
</html>
